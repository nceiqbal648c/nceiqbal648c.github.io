<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iqbal_A_Notes</title>
<style>
:root{--bg:#070b14;--card:#0f172a;--line:#1e293b;--ac:#00f3ff;--pk:#ff007f;--tx:#e2e8f0;--mut:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;background:radial-gradient(circle at top,#0b1120,#030408);color:var(--tx);min-height:100vh;padding:14px;display:flex;justify-content:center}
.wrap{width:100%;max-width:720px}
.box{background:rgba(15,23,42,.94);border:1px solid rgba(0,243,255,.35);border-radius:16px;padding:18px;box-shadow:0 0 26px rgba(0,243,255,.12)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid rgba(0,243,255,.2);padding-bottom:12px;margin-bottom:16px}
h1{font-size:19px;background:linear-gradient(90deg,var(--ac),var(--pk));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
input,textarea{width:100%;padding:12px 14px;background:#050811;border:1.5px solid var(--line);border-radius:10px;color:#fff;font-size:15px;outline:none;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 10px rgba(0,243,255,.25)}
textarea{height:230px;color:#38bdf8;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.6;white-space:pre;overflow:auto;resize:vertical;tab-size:4}
.btn{padding:9px 14px;border:1px solid rgba(0,243,255,.4);border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;background:rgba(0,243,255,.1);color:var(--ac);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.btn:active{background:var(--ac);color:#000}
.pri{background:linear-gradient(45deg,#00c6ff,#0066ff,var(--pk));color:#fff;border:0;width:100%;justify-content:center;padding:13px;font-size:15px}
.dng{background:rgba(255,0,127,.12);border-color:rgba(255,0,127,.45);color:var(--pk)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.note{background:var(--bg);border:1px solid rgba(0,243,255,.25);border-radius:12px;padding:14px;margin-top:14px}
.nh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.nt{font-weight:600;color:var(--ac);font-size:16px;word-break:break-word}
.nd{font-size:11px;color:var(--mut)}
pre{user-select:text;-webkit-user-select:text;background:#020308;border:1px solid var(--line);border-radius:10px;padding:11px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;max-height:280px;overflow:auto;line-height:1.55;white-space:pre}
.muted{font-size:13px;color:var(--mut);margin-bottom:10px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ac);color:#000;padding:10px 18px;border-radius:8px;font-weight:700;font-size:13px;display:none;z-index:99}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div class="box" id="app">
  <div class="head">
    <h1>⚡ Iqbal_A_Notes</h1>
    <div class="row" style="margin:0">
      <a href="index.html" class="btn">🏠</a>
      <button class="btn" onclick="backup()">📤 Backup</button>
      <button class="btn" onclick="document.getElementById('bfile').click()">📥 Restore</button>
      <input type="file" id="bfile" accept=".json" class="hide" onchange="restore(event)">
    </div>
  </div>
  <input type="hidden" id="eid">
  <input type="text" id="title" placeholder="শিরোনাম লিখুন...">
  <div class="row">
    <button class="btn" onclick="paste()">📋 Paste</button>
    <button class="btn dng" onclick="clearEd()">🧹 Clear</button>
  </div>
  <textarea id="content" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="কোড বা লেখা এখানে পেস্ট করুন (ফরম্যাট ঠিক থাকবে)..." spellcheck="false"></textarea>
  <button class="btn pri" id="sbtn" onclick="save()">💾 Save</button>
  <input type="text" id="q" placeholder="🔍 খুঁজুন..." style="margin-top:22px" oninput="render()">
  <div id="list"></div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
const DB_NAME="Iqbal_A_Notes_DB", OLD_DB="I_Ahmed_Vault_DB", STORE="notes_store";
let db=null, notes=[];
const $=id=>document.getElementById(id);

function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2200)}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- DB ---------- */
function openDB(name){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(name,1);
    r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:"id"})};
    r.onsuccess=e=>res(e.target.result);
    r.onerror=()=>rej(r.error);
  });
}
const tx=(mode)=>db.transaction(STORE,mode).objectStore(STORE);
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbAll=()=>reqP(tx("readonly").getAll());
const dbPut=n=>reqP(tx("readwrite").put(n));
const dbDel=id=>reqP(tx("readwrite").delete(id));

async function init(){
  try{
    db=await openDB(DB_NAME);
    // আগের ভল্টের নোট থাকলে একবার নতুন DB তে কপি
    if(!localStorage.getItem("iqn_migrated")){
      try{
        const old=await openDB(OLD_DB);
        if(old.objectStoreNames.contains(STORE)){
          const items=await reqP(old.transaction(STORE).objectStore(STORE).getAll());
          for(const n of items) await dbPut(n);
        }
        old.close();
      }catch(e){}
      localStorage.setItem("iqn_migrated","1");
    }
  }catch(e){alert("ডাটাবেস খোলা যায়নি: "+e)}
  localStorage.removeItem("iqn_hash"); localStorage.removeItem("vault_pass");
  $("content").value=localStorage.getItem("iqn_draft")||"";
  await render();
}

/* ---------- editor ---------- */
async function paste(){
  try{$("content").value+=await navigator.clipboard.readText();toast("পেস্ট হয়েছে")}
  catch(e){alert("বক্সে চেপে ধরে Paste করুন।")}
}
function clearEd(){
  $("eid").value="";$("title").value="";$("content").value="";
  $("sbtn").textContent="💾 Save";localStorage.removeItem("iqn_draft");
}
function draft(){ if(!$("eid").value) localStorage.setItem("iqn_draft",$("content").value) }
setInterval(draft,4000);

async function save(){
  const content=$("content").value;
  if(!content.trim()) return alert("কিছু লিখুন বা পেস্ট করুন!");
  const id=$("eid").value||("n"+Date.now());
  const old=notes.find(n=>n.id===id);
  await dbPut({id,title:$("title").value.trim()||"Untitled",content,created:old?old.created:Date.now(),updated:Date.now()});
  clearEd(); toast("সেভ হয়েছে ✔"); await render();
}

/* ---------- list ---------- */
let editingId=null;
async function render(){
  if(editingId&&$("ei-content")) window._ed={t:$("ei-title").value,c:$("ei-content").value};
  notes=await dbAll();
  notes.sort((a,b)=>(b.updated||b.created||0)-(a.updated||a.created||0));
  const q=$("q").value.trim().toLowerCase();
  const f=q?notes.filter(n=>(n.title+" "+n.content).toLowerCase().includes(q)):notes;
  $("list").innerHTML=f.length?f.map(n=>{
    if(n.id===editingId){
      const t=window._ed?window._ed.t:n.title, c=window._ed?window._ed.c:n.content;
      return `<div class="note">
        <input type="text" id="ei-title" value="${esc(t)}">
        <textarea id="ei-content" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">${esc(c)}</textarea>
        <div class="row" style="margin:8px 0 0">
          <button class="btn pri" style="width:auto" onclick="saveEdit('${n.id}')">✅ Update</button>
          <button class="btn" onclick="cancelEdit()">✖ Cancel</button>
          <button class="btn" onclick="copyBox()">📋 Copy</button>
        </div></div>`;
    }
    return `<div class="note">
      <div class="nh"><div><div class="nt">${esc(n.title||"Untitled")}</div>
      <div class="nd">${new Date(n.updated||n.created||Date.now()).toLocaleString("bn-BD")}</div></div>
      <div class="row" style="margin:0">
        <button class="btn" onclick="copy('${n.id}')">📋 Copy</button>
        <button class="btn" onclick="dl('${n.id}')">⬇️</button>
        <button class="btn" onclick="edit('${n.id}')">✏️ Edit</button>
        <button class="btn dng" onclick="del('${n.id}')">🗑️</button>
      </div></div>
      <pre>${esc(n.content)}</pre>
    </div>`}).join(""):'<p class="muted" style="margin-top:16px">কোনো নোট নেই।</p>';
}
const get=id=>notes.find(n=>n.id===id);
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  const t=document.createElement("textarea");
  t.value=text;t.style.cssText="position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(t);t.focus();t.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}
  t.remove();return ok;
}
async function copy(id){
  const ok=await copyText(get(id).content);
  toast(ok?"কপি হয়েছে (ফরম্যাট ঠিক)":"কপি হয়নি");
}
async function copyBox(){toast((await copyText($("ei-content").value))?"কপি হয়েছে":"কপি হয়নি")}
function dl(id){
  const n=get(id);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([n.content],{type:"text/plain"}));
  a.download=(n.title||"note").replace(/[^\w\u0980-\u09FF.-]+/g,"_")+".txt";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function edit(id){editingId=id;window._ed=null;render()}
function cancelEdit(){editingId=null;window._ed=null;render()}
async function saveEdit(id){
  const n=get(id), c=$("ei-content").value;
  if(!c.trim()) return alert("খালি রাখা যাবে না!");
  await dbPut({...n,title:$("ei-title").value.trim()||"Untitled",content:c,updated:Date.now()});
  editingId=null;window._ed=null;toast("আপডেট হয়েছে ✔");await render();
}
async function del(id){
  if(!confirm("মুছে ফেলবেন?")) return;
  await dbDel(id); toast("মুছে গেছে"); await render();
}

/* ---------- backup ---------- */
async function backup(){
  const data=await dbAll();
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));
  a.download="Iqbal_A_Notes_"+new Date().toISOString().slice(0,10)+".json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function restore(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr)) throw 0;
      let c=0;
      for(const n of arr){ if(n&&n.id&&typeof n.content==="string"){await dbPut(n);c++} }
      toast(c+"টি নোট রিস্টোর হয়েছে"); render();
    }catch(x){alert("ফাইলটি সঠিক ব্যাকআপ নয়!")}
    e.target.value="";
  };
  r.readAsText(f);
}

document.addEventListener("keydown",e=>{
  if(e.key==="Tab"&&e.target.tagName==="TEXTAREA"){
    e.preventDefault();const t=e.target;
    t.setRangeText("    ",t.selectionStart,t.selectionEnd,"end");
  }
});
init();
</script>
</body>
</html>
