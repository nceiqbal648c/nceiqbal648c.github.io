<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Iqbal Ahmed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#eef2ff;min-height:100vh;padding:20px 16px 50px;background:linear-gradient(-45deg,#0b1020,#1b1147,#0f2a4a,#2a0f3d);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center;padding:24px 0 14px}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;background:linear-gradient(135deg,#6366f1,#ec4899)}
h1{font-size:28px;background:linear-gradient(90deg,#a5b4fc,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:#c7d2fe;margin-top:6px;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.tabs button{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid #ffffff22;background:#ffffff14;color:#eef2ff;font-size:14px}
.tabs button.on{background:linear-gradient(90deg,#6366f1,#ec4899);border-color:transparent}
.post,a.card{display:block;background:#ffffff0f;border:1px solid #ffffff22;border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
a.card{display:flex;gap:12px;align-items:center;color:#eef2ff;text-decoration:none}
.ic{flex:0 0 42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#6366f144}
.bd{font-size:12px;padding:4px 10px;border-radius:99px;background:#6366f144;text-transform:capitalize}
.post h3{margin:10px 0 6px;font-size:17px}
.post img{width:100%;border-radius:12px;margin:8px 0}
.post p{line-height:1.55;color:#e0e7ff;font-size:15px;word-break:break-word}
.act{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px;flex-wrap:wrap}
.act small{color:#8b93c4}
.act button{background:#ffffff14;border:1px solid #ffffff22;color:#eef2ff;border-radius:8px;padding:6px 10px;margin-left:4px;font-size:13px}
.empty{text-align:center;color:#8b93c4;padding:30px}
#addbtn{display:none;width:100%;padding:14px;border:0;border-radius:14px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,#6366f1,#ec4899);margin-bottom:12px}
#form{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:flex-end}
#form.on{display:flex}
.sheet{background:#141a33;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;display:flex;flex-direction:column;gap:10px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff33;background:#0b1020;color:#eef2ff;font-size:15px;font-family:inherit}
.sheet textarea{min-height:140px}
.row{display:flex;gap:8px}
.row button{flex:1;padding:13px;border-radius:10px;border:0;font-weight:700;color:#fff;background:#ffffff22}
.row button#pbtn{background:linear-gradient(90deg,#6366f1,#ec4899)}
footer{text-align:center;margin-top:30px;color:#8b93c4;font-size:13px}
footer button{background:none;border:0;color:#8b93c4;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="av">I</div><h1>Iqbal Ahmed</h1><p class="tag">AI prompts, travel and fun tools 🇧🇩</p></header>
<div class="tabs">
<button class="on" onclick="f('all',this)">All</button>
<button onclick="f('prompt',this)">✍️ Prompt</button>
<button onclick="f('travel',this)">✈️ Travel</button>
<button onclick="f('status',this)">💬 Status</button>
<button onclick="f('proj',this)">🚀 Projects</button>
</div>
<button id="addbtn" onclick="newPost()">＋ New post</button>
<div id="feed"></div>
<footer>© 2026 Iqbal Ahmed<br><button onclick="admin()">🔐 Admin</button></footer>
</div>

<div id="form"><div class="sheet">
<select id="ptype"><option value="prompt">✍️ Prompt</option><option value="travel">✈️ Travel</option><option value="status">💬 Status</option></select>
<input id="ptitle" placeholder="Title (optional)">
<textarea id="ptext" placeholder="Likhun..."></textarea>
<input id="pimg" type="file" accept="image/*">
<div class="row"><button onclick="closeForm()">Cancel</button><button id="pbtn" onclick="publish()">Publish</button></div>
</div></div>

<script>
const O='nceiqbal648c',R='nceiqbal648c.github.io',API='https://api.github.com/repos/'+O+'/'+R+'/contents/';
const ic={prompt:'✍️',travel:'✈️',status:'💬'};
const proj=[['⬇️','Iqbal Video Downloader','Iqbal_Video_Downloader'],['▶️','Iqbal Player V2','Iqbal_Player_V2'],['🤖','Junu AI','Junu_ai'],['🔗','Iqbal Deep Resolver','iqbal_deep_resolver'],['🧭','Iqbal URL Adventure','iqbal_url_adventure'],['⚽','My Football Game','my_football_game']];
let posts=[],sha=null,tok=localStorage.getItem('tk')||'',editId=null,flt='all';
const $=id=>document.getElementById(id);
const g=id=>posts.find(p=>p.id==id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u2b=s=>btoa(unescape(encodeURIComponent(s)));
const b2u=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const H=()=>({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'});

async function load(){
 try{
  if(tok){
   const r=await fetch(API+'posts.json',{headers:H()});
   if(r.ok){const j=await r.json();sha=j.sha;posts=JSON.parse(b2u(j.content))}
   else if(r.status==404){sha=null;posts=[]}
   else throw new Error('Token thik na');
  }else{
   const r=await fetch('posts.json?'+Date.now());
   posts=r.ok?await r.json():[];
  }
 }catch(e){posts=[];if(tok)alert(e.message)}
 bar();render();
}
async function save(msg){
 const body={message:msg,content:u2b(JSON.stringify(posts,null,1)),branch:'main'};
 if(sha)body.sha=sha;
 const r=await fetch(API+'posts.json',{method:'PUT',headers:H(),body:JSON.stringify(body)});
 if(!r.ok)throw new Error('Save hoyni ('+r.status+')');
 sha=(await r.json()).content.sha;
}
function shrink(file){return new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75).split(',')[1])};i.src=URL.createObjectURL(file)})}
async function upImg(b64){
 const p='img/'+Date.now()+'.jpg';
 const r=await fetch(API+p,{method:'PUT',headers:H(),body:JSON.stringify({message:'img',content:b64,branch:'main'})});
 if(!r.ok)throw new Error('Chobi upload hoyni');
 return p;
}
async function publish(){
 const t=$('ptitle').value.trim(),x=$('ptext').value.trim();
 if(!t&&!x)return alert('Kichu likhun');
 const b=$('pbtn');b.disabled=true;b.textContent='Wait...';
 try{
  const old=editId?g(editId):null;
  let img=old?old.img:'';
  const file=$('pimg').files[0];
  if(file)img=await upImg(await shrink(file));
  const d={type:$('ptype').value,title:t,text:x,img:img||''};
  if(old)Object.assign(old,d,{edited:1});
  else posts.unshift({id:Date.now(),date:new Date().toISOString(),...d});
  await save('post');
  closeForm();render();
 }catch(e){alert(e.message);load()}
 b.disabled=false;b.textContent='Publish';
}
function render(){
 if(flt=='proj'){$('feed').innerHTML=proj.map(p=>'<a class="card" href="https://github.com/'+O+'/'+p[2]+'"><div class="ic">'+p[0]+'</div><b>'+p[1]+'</b></a>').join('');return}
 const L=posts.filter(p=>flt=='all'||p.type==flt);
 $('feed').innerHTML=L.length?L.map(p=>'<article class="post"><span class="bd">'+ic[p.type]+' '+p.type+'</span>'+(p.title?'<h3>'+esc(p.title)+'</h3>':'')+(p.img?'<img src="'+p.img+'" loading="lazy">':'')+'<p>'+esc(p.text).replace(/\n/g,'<br>')+'</p><div class="act"><small>'+new Date(p.date).toLocaleDateString()+(p.edited?' · edited':'')+'</small><span>'+(p.type=='prompt'?'<button onclick="cp('+p.id+')">📋 Copy</button>':'')+'<button onclick="sh('+p.id+')">📤 Share</button>'+(tok?'<button onclick="ed('+p.id+')">✏️</button><button onclick="del('+p.id+')">🗑️</button>':'')+'</span></div></article>').join(''):'<p class="empty">Kono post nei</p>';
}
function f(t,b){flt=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function cp(id){navigator.clipboard.writeText(g(id).text).then(()=>alert('Copied!'))}
function sh(id){const p=g(id),d={title:p.title||'Iqbal Ahmed',text:p.text,url:location.href};navigator.share?navigator.share(d):cp(id)}
function ed(id){const p=g(id);editId=id;$('ptype').value=p.type;$('ptitle').value=p.title;$('ptext').value=p.text;$('pimg').value='';$('form').classList.add('on')}
async function del(id){if(!confirm('Delete korben?'))return;posts=posts.filter(p=>p.id!=id);try{await save('delete');render()}catch(e){alert(e.message);load()}}
function newPost(){editId=null;['ptitle','ptext','pimg'].forEach(i=>$(i).value='');$('form').classList.add('on')}
function closeForm(){$('form').classList.remove('on')}
function bar(){$('addbtn').style.display=tok?'block':'none'}
function admin(){
 if(!tok){const t=prompt('GitHub token paste korun');if(!t)return;tok=t.trim();localStorage.setItem('tk',tok);load()}
 else if(confirm('Logout korben?')){tok='';localStorage.removeItem('tk');load()}
}
load();
</script>
</body>
</html>
